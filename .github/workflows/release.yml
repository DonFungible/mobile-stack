name: Release

# Store builds are made here and nowhere else. Nothing reaches users from this workflow:
# it produces signed artifacts for TestFlight / the Play internal track, and a person promotes them.
#
# Required secrets (repository or `release` environment):
#   Android: RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
#   iOS:     APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8, DEVELOPMENT_TEAM
#
# The build number is the workflow run number: unique, increasing, never bumped by hand.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

jobs:
  android:
    name: Android production bundle
    if: inputs.platform != 'ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > apps/android/keystore/release.jks
      - name: Build bundle
        working-directory: apps/android
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          bun run generate
          ./gradlew :app:bundleProductionRelease -PversionCode=${{ github.run_number }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-production-${{ github.run_number }}
          path: apps/android/app/build/outputs/bundle/productionRelease/*.aab

  ios:
    name: iOS App Store archive
    if: inputs.platform != 'android' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: brew install xcodegen
      - name: Write App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: echo "$KEY" > "$RUNNER_TEMP/asc.p8"
      - name: Archive
        working-directory: apps/ios
        run: |
          bun run generate
          xcodebuild archive \
            -project MobileStack.xcodeproj -scheme MobileStack -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MobileStack.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            CODE_SIGN_STYLE=Automatic
      - name: Export and upload to TestFlight
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MobileStack.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
