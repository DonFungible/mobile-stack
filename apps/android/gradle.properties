org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# The one place the marketing version lives. CI passes -PversionCode; never bump it by hand.
appVersionName=0.1.0

# Editor tooling (kotlin-lsp, Compose Preview) configures every variant and needs unit tests on all of them.
android.onlyEnableUnitTestForTheTestedBuildType=false
