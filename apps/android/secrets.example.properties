# Copy to secrets.properties (gitignored). `bun run generate` does this for you on first run.
# Only client-safe keys belong here: anything shipped in an app binary is public.
ANALYTICS_API_KEY=
ERROR_REPORTING_DSN=

# Release signing. CI supplies these from its secret store; never build a store release locally.
RELEASE_STORE_FILE=
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_PASSWORD=
